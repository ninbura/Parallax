name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    # Ubuntu confines `wg` with AppArmor (files only under /etc/wireguard);
    # apply pipes the config, so the latest Ubuntu is the one to test on.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # root: as the Docker image runs it. unit: as the native service
        # (packaging/systemd/parallax.service), unprivileged and sandboxed.
        daemon: [root, unit]
    name: integration (${{ matrix.daemon }})
    steps:
      - uses: actions/checkout@v4
      - run: rustup install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nftables wireguard-tools dnsmasq-base dnsutils curl openssl iputils-ping
      - run: cargo build -p parallax-cli
      - run: sudo env PATH="$PATH" NETNS_DAEMON=${{ matrix.daemon }} ./tests/integration/netns.sh
      - if: matrix.daemon == 'unit'
        run: systemd-analyze security --offline=true --threshold=20 packaging/systemd/parallax.service

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t parallax:ci .
      - run: docker run --rm --entrypoint parallax parallax:ci --version
      - run: sudo modprobe wireguard
      - run: sudo sysctl -w net.ipv4.ip_forward=1
      # The example config names eth0; give the runner one if it has none.
      - run: ip link show eth0 || sudo ip link add eth0 type dummy
      # Import the example the way the first start does, then check the host.
      - run: docker run --rm --network host --cap-add NET_ADMIN -v "$PWD/example/parallax.toml:/etc/parallax/parallax.toml:ro" --entrypoint sh parallax:ci -c 'parallax config import --if-empty /etc/parallax/parallax.toml && parallax doctor'
