name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    # Ubuntu confines `wg` with AppArmor (files only under /etc/wireguard);
    # apply pipes the config, so the latest Ubuntu is the one to test on.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # root: as the Docker image runs it. unit: as the native service
        # (packaging/systemd/parallax.service), unprivileged and sandboxed.
        daemon: [root, unit]
    name: integration (${{ matrix.daemon }})
    steps:
      - uses: actions/checkout@v4
      - run: rustup install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nftables wireguard-tools dnsmasq-base dnsutils curl openssl iputils-ping
      # (t): the Headscale docker/headscale.Dockerfile pins, and a Tailscale client.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: ./tests/integration/headscale-binaries.sh "$RUNNER_TEMP/headscale" >> "$GITHUB_ENV"
      - run: cargo build -p parallax-cli
      - run: sudo env PATH="$PATH" NETNS_DAEMON=${{ matrix.daemon }} HEADSCALE="$HEADSCALE" TAILSCALED="$TAILSCALED" TAILSCALE="$TAILSCALE" ./tests/integration/netns.sh
      - if: matrix.daemon == 'unit'
        run: systemd-analyze security --offline=true --threshold=20 packaging/systemd/parallax.service

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t parallax:ci .
      - run: docker run --rm --entrypoint parallax parallax:ci --version
      # The Headscale image, and the configuration we ship, which it must accept.
      - run: docker build -f docker/headscale.Dockerfile -t parallax-headscale:ci docker
      - run: docker run --rm -v "$PWD/docker/headscale:/etc/headscale:ro" parallax-headscale:ci check config -f /etc/headscale/config.yaml
      - run: sudo modprobe wireguard
      - run: sudo sysctl -w net.ipv4.ip_forward=1
      # The example config names eth0; give the runner one if it has none.
      - run: ip link show eth0 || sudo ip link add eth0 type dummy
      # Import the example the way the first start does, then check the host.
      - run: docker run --rm --network host --cap-add NET_ADMIN -v "$PWD/example/parallax.toml:/etc/parallax/parallax.toml:ro" --entrypoint sh parallax:ci -c 'parallax config import --if-empty /etc/parallax/parallax.toml && parallax doctor'

  package:
    # Static (musl) binaries, and the .deb and Arch package built from them
    # (packaging/nfpm.yaml), kept as artifacts. Publishing releases is step 20.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          # Built on an arm runner, not cross-compiled.
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: package (${{ matrix.arch }})
    env:
      NFPM_VERSION: v2.48.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # ring has C and assembly; musl-gcc builds them against musl.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          export "CC_$(echo ${{ matrix.target }} | tr - _)=musl-gcc"
          cargo build --release --locked --target ${{ matrix.target }} -p parallax-cli
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - name: the binary is static and runs
        run: |
          bin=target/${{ matrix.target }}/release/parallax
          file "$bin"
          file "$bin" | grep 'static-pie linked\|statically linked'
          "$bin" --version
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION
      - shell: bash # with pipefail
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/parallax dist/parallax
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "parallax-cli") | .version')
          test -n "$VERSION"
          export VERSION ARCH=${{ matrix.arch }} BINARY=dist/parallax
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p archlinux -t dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: parallax-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  install-deb:
    # The .deb on a fresh Ubuntu, run as the real service: the user, the
    # directories, the sysctl and the module from the package; the example
    # configuration imported on the first start.
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: parallax-amd64
          path: dist
      # Undo what the runner already has (Docker turns forwarding on), so the
      # checks below see what the package did.
      - run: sudo sysctl -w net.ipv4.ip_forward=0 && (sudo modprobe -r wireguard || true)
      - run: sudo apt-get update && sudo apt-get install -y ./dist/parallax_*_amd64.deb
      - run: getent passwd parallax && test "$(sudo stat -c %U:%a /etc/parallax)" = parallax:700
      - run: test "$(sysctl -n net.ipv4.ip_forward)" = 1 && test -d /sys/module/wireguard
      # Installed, not enabled: it has nothing to run until it has a configuration.
      - run: test "$(systemctl is-enabled parallax)" = disabled
      # The example config names eth0; give the runner one if it has none.
      - run: ip link show eth0 || sudo ip link add eth0 type dummy
      - run: sudo install -m 0600 -o parallax -g parallax example/parallax.toml /etc/parallax/parallax.toml
      - run: sudo systemctl start parallax
      - run: sudo parallax status
      - run: sudo parallax doctor
      - run: sudo parallax peer show
      - run: test "$(ps -o user= -p "$(systemctl show -P MainPID parallax)")" = parallax
      - run: systemd-analyze security --threshold=20 parallax.service
      # An upgrade (here a reinstall) restarts a running service.
      - run: |
          before=$(systemctl show -P MainPID parallax)
          sudo apt-get install -y --reinstall ./dist/parallax_*_amd64.deb
          test "$(systemctl show -P MainPID parallax)" != "$before"
          sudo parallax status
      - if: failure()
        run: sudo journalctl -u parallax --no-pager
      # Removing it takes the gateway down and leaves the keys and database.
      - run: sudo apt-get remove -y parallax
      - shell: bash
        run: |
          ip -o link show > links && sudo nft list tables > tables
          ! grep -q ': wg0:' links && ! grep -qx 'table inet parallax' tables
      - run: sudo test -f /etc/parallax/wg-server.key && sudo test -f /var/lib/parallax/parallax.db

  install-arch:
    # The Arch package in an archlinux container: pacman's systemd hooks
    # create the user and /etc/parallax. No systemd runs there, so no start.
    needs: package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: parallax-amd64
          path: dist
      - run: pacman -Syu --noconfirm
      - run: pacman -U --noconfirm dist/parallax-*-x86_64.pkg.tar.zst
      - run: parallax --version
      - run: getent passwd parallax && test "$(stat -c %U:%a /etc/parallax)" = parallax:700
      - run: test -f /usr/lib/systemd/system/parallax.service && test -f /usr/lib/sysctl.d/90-parallax.conf
