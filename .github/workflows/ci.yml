name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    # Ubuntu 26.04 confines `wg` with AppArmor, which blocks reading the test's
    # generated config. Revisit with the native install (Ubuntu hosts hit it too).
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: rustup install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nftables wireguard-tools dnsmasq-base dnsutils curl
      - run: cargo build -p parallax-cli
      - run: sudo env PATH="$PATH" ./tests/integration/netns.sh

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t parallax:ci .
      - run: docker run --rm --entrypoint parallax parallax:ci --version
      - run: sudo modprobe wireguard
      # The example config names eth0; give the runner one if it has none.
      - run: ip link show eth0 || sudo ip link add eth0 type dummy
      - run: docker run --rm --network host --cap-add NET_ADMIN -v "$PWD/example/parallax.toml:/etc/parallax/parallax.toml:ro" parallax:ci doctor
