name: release
# A tag vX.Y.Z publishes Parallax X.Y.Z (docs/releasing.md):
#   - the static binaries, the .deb and the Arch package from ci.yml's
#     package job, with SHA256SUMS, on a GitHub Release;
#   - ghcr.io/<owner>/parallax and parallax-headscale for amd64 and arm64,
#     tagged X.Y.Z, plus X.Y and latest when it's the newest of those;
#   - a build provenance attestation for each of them.
# Nothing is published unless the whole of ci.yml passes first, and image
# tags move only once both images are pushed and run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release at a time, so latest and X.Y can't end up on different
# versions for the two images.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the check that the tag is on main
      - run: rustup install # the version in rust-toolchain.toml
      - id: check
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "parallax-cli") | .version')
          # Final releases only: a pre-release's version doesn't carry over
          # into the Arch package (nfpm drops it) or a .deb's file name.
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version $version in Cargo.toml isn't X.Y.Z; pre-releases aren't published"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version); expected v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    # Both images pushed by digest only, run, and attested. release tags them.
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      registry: ${{ steps.build.outputs.registry }}
      parallax: ${{ steps.build.outputs.parallax }}
      headscale: ${{ steps.build.outputs.headscale }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: parallax-*
          path: dist
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        shell: bash
        run: |
          registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          # build <image> <licenses> <buildx args...>; outputs <image>=<digest>
          build() {
            local image=$1 licenses=$2
            shift 2
            docker buildx build --platform linux/amd64,linux/arm64 \
              --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation "index:org.opencontainers.image.licenses=$licenses" \
              --output "type=image,name=$registry/$image,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$image.json" "$@"
            echo "${image#parallax-}=$(jq -er '."containerimage.digest"' "$image.json")" >> "$GITHUB_OUTPUT"
          }
          build parallax "MIT OR Apache-2.0" -f docker/Dockerfile --target release .
          build parallax-headscale BSD-3-Clause -f docker/headscale.Dockerfile docker
      - name: the pushed images run
        shell: bash
        env:
          PARALLAX: ${{ steps.build.outputs.registry }}/parallax@${{ steps.build.outputs.parallax }}
          HEADSCALE: ${{ steps.build.outputs.registry }}/parallax-headscale@${{ steps.build.outputs.headscale }}
        run: |
          for arch in amd64 arm64; do
            # --pull=always: one digest names both platforms, and the local
            # copy from the last loop is the other one.
            docker run --rm --pull=always --platform linux/$arch --entrypoint parallax "$PARALLAX" --version \
              | grep -Fx "parallax $VERSION"
            docker run --rm --pull=always --platform linux/$arch "$HEADSCALE" version
          done
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.build.outputs.registry }}/parallax
          subject-digest: ${{ steps.build.outputs.parallax }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.build.outputs.registry }}/parallax-headscale
          subject-digest: ${{ steps.build.outputs.headscale }}
          push-to-registry: true

  release:
    # The files and their checksums, attested; then the image tags; then
    # the GitHub Release, published last, once everything is out. Safe to
    # re-run on its own (docs/releasing.md).
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ${{ needs.images.outputs.registry }}
      PARALLAX_DIGEST: ${{ needs.images.outputs.parallax }}
      HEADSCALE_DIGEST: ${{ needs.images.outputs.headscale }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main and every tag, for the image tags below
      - name: refuse to replace a published release
        shell: bash
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null || true)
          if [ "$draft" = false ]; then
            echo "::error::release $GITHUB_REF_NAME is already published"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: parallax-*
          path: dist
      - shell: bash
        run: |
          mkdir release
          for arch in amd64 arm64; do
            cp "dist/parallax-$arch/parallax" "release/parallax-$VERSION-linux-$arch"
            cp dist/parallax-$arch/*.deb dist/parallax-$arch/*.pkg.tar.zst release/
          done
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" = 6
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: release/SHA256SUMS
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag the images
        shell: bash
        run: |
          # X.Y.Z always; X.Y and latest only if no newer release on main has
          # them, so a late or re-run older release can't move them back.
          # Worked out here, not in an earlier job, so a re-run sees the
          # releases made since.
          releases=$(git tag --merged origin/main -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          minor=${VERSION%.*}
          tags=("$VERSION")
          if [ "$(grep -E "^v${minor//./\\.}\.[0-9]+$" <<< "$releases" | tail -n 1)" = "v$VERSION" ]; then
            tags+=("$minor")
          fi
          if [ "$(tail -n 1 <<< "$releases")" = "v$VERSION" ]; then
            tags+=(latest)
          fi
          echo "image tags: ${tags[*]}"

          # digest <image:tag>: what it points at, nothing if there's no such tag.
          digest() {
            local out
            if out=$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>&1); then
              jq -er .digest <<< "$out"
            elif ! grep -qi 'not found' <<< "$out"; then
              echo "::error::can't inspect $1: $out" >&2
              return 1
            fi
          }

          for image in parallax:$PARALLAX_DIGEST parallax-headscale:$HEADSCALE_DIGEST; do
            name=$REGISTRY/${image%%:*} want=${image#*:}
            # A re-run of this job alone finds its own digests here and goes on;
            # one that rebuilt the images would swap what X.Y.Z points at.
            current=$(digest "$name:$VERSION")
            if [ -n "$current" ] && [ "$current" != "$want" ]; then
              echo "::error::$name:$VERSION already points at $current, not $want"
              exit 1
            fi
            # --prefer-index=false: copy the index as it is, so the tags name
            # the attested digest.
            for tag in "${tags[@]}"; do
              docker buildx imagetools create --prefer-index=false -t "$name:$tag" "$name@$want"
              test "$(digest "$name:$tag")" = "$want"
            done
          done
      - name: publish the GitHub Release
        shell: bash
        run: |
          # As a draft until every file is up, so a failed upload leaves
          # nothing half published, and a re-run picks the draft up.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "Parallax $VERSION"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
