[package]
name = "parallax-cli"
description = "Parallax command-line harness"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "parallax"
path = "src/main.rs"

[dependencies]
parallax-core = { path = "../parallax-core" }
parallax-proxy = { path = "../parallax-proxy" }
parallax-dns = { path = "../parallax-dns" }
parallax-store = { path = "../parallax-store" }
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
rustix.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# The Headscale API client (headscale.rs), on the HTTP stack the proxy
# already uses.
hyper.workspace = true
hyper-util.workspace = true
hyper-rustls.workspace = true
http-body-util.workspace = true
rustls.workspace = true

[lints]
workspace = true

[dev-dependencies]
rcgen.workspace = true
