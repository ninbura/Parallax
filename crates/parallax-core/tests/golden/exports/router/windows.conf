# Parallax peer "router" (template "personal", windows flavour)
# AllowedIPs are a courtesy for split tunnelling; the gateway enforces access server-side.
[Interface]
PrivateKey = <paste the private key shown when this peer was created>
Address = 10.8.1.1/32
# Split DNS on Windows: add a Name Resolution Policy Table rule for the home zones (mydomain.com).
# Once, in an elevated PowerShell:
#   Add-DnsClientNrptRule -Namespace ".mydomain.com" -NameServers "10.8.0.1"
# These rules stay in force while the tunnel is down: home names then fail, even at home.
# Remove them when you stop using this tunnel:
#   Get-DnsClientNrptRule | Where-Object { $_.Namespace -eq ".mydomain.com" } | Remove-DnsClientNrptRule -Force
# Leave the DNS line unset so all other names keep using the local network's resolver.

[Peer]
PublicKey = DSuieBHAaq5V19ySBwUTiLBh9Pnduq1K9gcWaxXqMVc=
Endpoint = vpn.mydomain.com:51820
AllowedIPs = 198.18.1.0/24, 10.8.0.1/32
PersistentKeepalive = 25
