# Parallax peer "router" (template "personal", mobile flavour)
# AllowedIPs are a courtesy for split tunnelling; the gateway enforces access server-side.
[Interface]
PrivateKey = <paste the private key shown when this peer was created>
Address = 10.8.1.1/32
DNS = 10.8.0.1
# DNS is tunnel-wide: the official iOS/Android WireGuard apps cannot route DNS per domain.
# Names on the network you are visiting will not resolve while connected (mDNS/Bonjour,
# e.g. casting and AirPlay, is multicast and unaffected; raw IPs always work; Android can
# exempt apps). For real split DNS on a phone use the Tailscale transport instead.

[Peer]
PublicKey = DSuieBHAaq5V19ySBwUTiLBh9Pnduq1K9gcWaxXqMVc=
Endpoint = vpn.mydomain.com:51820
AllowedIPs = 198.18.1.0/24, 10.8.0.1/32
PersistentKeepalive = 25
