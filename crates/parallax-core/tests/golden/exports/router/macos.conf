# Parallax peer "router" (template "personal", macos flavour)
# AllowedIPs are a courtesy for split tunnelling; the gateway enforces access server-side.
[Interface]
PrivateKey = <paste the private key shown when this peer was created>
Address = 10.8.1.1/32
# Split DNS on macOS: the WireGuard app cannot route DNS per domain, so tell the system
# resolver to use the shim only for the home zones (mydomain.com). Once, as admin:
#   sudo mkdir -p /etc/resolver
#   printf 'nameserver 10.8.0.1\n' | sudo tee /etc/resolver/mydomain.com
# Leave the DNS line unset so all other names keep using the local network's resolver.

[Peer]
PublicKey = DSuieBHAaq5V19ySBwUTiLBh9Pnduq1K9gcWaxXqMVc=
Endpoint = vpn.mydomain.com:51820
AllowedIPs = 198.18.1.0/24, 10.8.0.1/32
PersistentKeepalive = 25
