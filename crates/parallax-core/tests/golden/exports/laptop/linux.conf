# Parallax peer "laptop" (template "personal", linux flavour)
# AllowedIPs are a courtesy for split tunnelling; the gateway enforces access server-side.
[Interface]
PrivateKey = AAICAgICAgICAgICAgICAgICAgICAgICAgICAgICAkI=
Address = 10.8.1.2/32
# Split DNS via systemd-resolved: only the home zones use the shim through the tunnel.
PostUp = resolvectl dns %i 10.8.0.1; resolvectl domain %i ~mydomain.com
PostDown = resolvectl revert %i

[Peer]
PublicKey = DSuieBHAaq5V19ySBwUTiLBh9Pnduq1K9gcWaxXqMVc=
Endpoint = vpn.mydomain.com:51820
AllowedIPs = 192.168.240.0/24, 10.8.0.1/32
PersistentKeepalive = 25
