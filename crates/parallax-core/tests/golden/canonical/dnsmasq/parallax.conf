# Generated by Parallax. Do not edit.
# Domain-scoped shim: forwards only the home zones to the home resolvers and rewrites
# their A answers from real to virtual prefixes. AAAA answers pass through untranslated
# (no IPv6 mapping in this release); PTR queries for virtual addresses are not rewritten.

no-resolv
no-hosts
no-poll
bind-dynamic
listen-address=10.8.0.1
port=53
cache-size=1000

# Home zones -> the existing source of truth (only these zones transit the shim)
server=/mydomain.com/192.168.1.1

# Prefix rewrite of answers, one line per mapped network (mirror of the NETMAP rule)
alias=192.168.1.0,198.18.1.0,255.255.255.0

# Rebind protection: private answers are only acceptable from the home zones
stop-dns-rebind
rebind-localhost-ok
rebind-domain-ok=/mydomain.com/

# Catch-all for tunnel-wide clients (mobile WireGuard apps cannot split DNS, so their
# exports send every query here, even under a split template)
server=1.1.1.1
