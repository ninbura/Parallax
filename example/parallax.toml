# Parallax configuration: the canonical scenario.
#
# One home LAN (192.168.1.0/24, which collides with most guest networks) is
# presented to every VPN client as 198.18.1.0/24. Two grants: "personal"
# reaches everything, "family" reaches exactly one service. Each peer has
# one or more grants and reaches what they give together. Both transports
# (WireGuard and Tailscale via Headscale) are always on; grants apply to
# both. `transport` on a peer records which one that device uses; it is not
# a policy choice.
#
# Keys in this file are throwaway demo keys so the file round-trips in tests.
# Never reuse them.

[server.wireguard]
interface = "wg0"
listen_port = 51820
# Every peer's address comes from this range; the gateway takes 10.8.0.1.
supernet = "10.8.0.0/16"
# What clients connect to.
endpoint = "vpn.mydomain.com:51820"
# Public half of the key in private_key_file. `parallax keygen --write-config` fills this in.
public_key = "DSuieBHAaq5V19ySBwUTiLBh9Pnduq1K9gcWaxXqMVc="
private_key_file = "/etc/parallax/wg-server.key"

[server.wireguard.peer_defaults]
# Client settings `parallax peer add` gives a new peer (see [[peer]] below).
# Each peer keeps its own copy.
dns = "split"
allowed_ips = "mapped_subnets"

[server.headscale]
# Control plane only; carries no traffic. Driven through its API from M2 on.
server_url = "https://headscale.mydomain.com"
api_key_file = "/etc/parallax/headscale-api.key"
# "embedded" uses Headscale's built-in DERP relay; "tailscale" uses the public relay map.
derp = "embedded"
# Name of the subnet-router node running inside the parallax container.
subnet_router_node = "parallax-gateway"
interface = "tailscale0"
# Tailscale nodes' DNS: Headscale's split DNS is the same for the whole tailnet.
dns = "split"

[server.dns]
# Parallax's DNS server listens on the WireGuard gateway address unless overridden.
# listen = "10.8.0.1"
port = 53
# Where public names go, for peers granted public_dns.
public_resolver = "1.1.1.1"

[server.firewall]
# "nftables" (default) or "iptables-nft".
backend = "nftables"
# Set when the gateway runs host-networked next to Docker: adds DOCKER-USER accepts.
docker_coexistence = true

[server.proxy]
# The HTTPS proxy for services with `hostnames`. Listens on the WireGuard
# gateway address unless overridden.
# listen = "10.8.0.1"
port = 8443
# Parallax never issues certificates. Every directory under this folder with
# fullchain.pem and privkey.pem is one certificate (certbot's live/<name>
# works); each proxied hostname needs one that covers it.
certificates = "/etc/parallax/certs"
# Upstream certificates (and encrypted DNS providers', see [server.public_ip])
# are verified against this CA bundle.
upstream_ca = "/etc/ssl/certs/ca-certificates.crt"

[server.backup]
# Backups of the database and the server key, one file each (docs/backup.md).
# Best on another disk than the database.
directory = "/var/lib/parallax/backups"
# Back up every `interval` when something changed.
automatic = true
interval = "1d"
# The oldest are deleted past this many.
keep = 14
# Encrypted with the passphrase in passphrase_file. Set it with
# `parallax backup passphrase` and keep a copy in your password manager.
encrypt = true
passphrase_file = "/etc/parallax/backup.passphrase"

[server.public_ip]
# Guests with `internet` may not reach the home's own public IP: the
# router would hairpin it back into your port forwards. Parallax finds it from
# the endpoint above (a public IP, or its hostname through dns.public_resolver).
# Set a fixed address to skip the lookup:
# address = "<your public IPv4>"
# If public_resolver answers your own hostname with a LAN address, ask these
# over DNS over HTTPS, in order ("quad9", "cloudflare"); off when empty.
encrypted_dns = []

# A physical network the gateway reaches. `mapped_to` is the collision-free
# prefix clients see; host bits are preserved (192.168.1.5 -> 198.18.1.5).
# 198.18.0.0/15 is reserved for benchmarking (RFC 2544), so no home or office
# LAN a client roams onto will use it; mirroring the real third octet keeps it
# memorable (192.168.N.0/24 -> 198.18.N.0/24). Proxy apps with "fake-IP" DNS
# (Clash, Surge, sing-box) also default to it, so avoid it on such clients.
# `domains` are the DNS zones whose names live here: they scope the shim, the
# clients' routing domains and (M2) Headscale split DNS. The real home
# resolver stays the source of truth; Parallax holds no records.
[[network]]
name = "home"
interface = "eth0"
# The gateway host's own address here. Set it when services run on the
# gateway box itself (e.g. Docker containers with published ports); grants
# covering it then open the host, not just the LAN behind it.
# gateway_address = "192.168.1.2"
subnet = "192.168.1.0/24"
mapped_to = "198.18.1.0/24"
upstream_dns = ["192.168.1.1"]
domains = ["mydomain.com"]
# Leave off unless your router cannot hold a static route back to the tunnel
# ranges; masquerading hides the peer's address from LAN services.
masquerade = false

# Named host:port targets. `nginx_vhost = true` also emits an allow/deny
# snippet for the vhost, because L3 rules gate the port, not the virtual host.
# `host` is the real address, or a DNS name under a network's domains: the
# gateway looks it up through that network's upstream_dns and grants what it
# resolves to (only addresses inside a configured network, or the home's
# public IP for a service behind a port forward: there one port per grant,
# and web ports only as a service with `hostnames`).
[[service]]
name = "immich"
host = "192.168.1.5"
# Like ufw: "445/tcp", "137-138/udp", or a bare "25565" for TCP and UDP.
ports = ["443/tcp"]
nginx_vhost = true
# HTTPS names this service answers to. With them set, `service` grants reach
# it only through Parallax's HTTPS proxy, which lets these names through and
# nothing else, so a guest can't use the other sites on the same box.
# hostnames = ["immich.mydomain.com"]

# A service with several ports: SMB on the NAS, defined once, granted by name.
# [[service]]
# name = "nas-smb"
# host = "nas.mydomain.com"
# ports = ["137-138/udp", "139/tcp", "445/tcp"]

# Grants say what peers reach: named bundles of rules, attached to any
# number of peers. A peer reaches the union of its grants; rules only add.
# `everyone = true` gives a grant to every peer, current and future.
[[grant]]
name = "personal"
# public_dns: the gateway answers public names too. Phones on the WireGuard
# app send every query to the gateway, so without it they resolve only the
# home names they're granted while connected.
rules = [
    { kind = "all_networks" },
    { kind = "public_dns" },
]

[[grant]]
name = "family"
# More rules, one per line: a host and its ports, by address or by name
# (the name then also answers in DNS for its peers):
#   { kind = "service", name = "nas-smb" },
#   { kind = "host", host = "game.mydomain.com", ports = ["25565"] },
# A host rule without ports reaches every port of it. Without public_dns the
# gateway answers only the names granted here (Immich), so a guest's other
# lookups never leave through the home connection.
rules = [{ kind = "service", name = "immich" }]

# Peers. `parallax peer add` appends these, with an address from the
# supernet; the address never changes when its grants do.
[[peer]]
name = "router"
grants = ["personal"]
transport = "wireguard"
[peer.wireguard]
public_key = "pOCSkrZRwni5dyxWn1+puxPZBrRqtoyd+dwrRAn4ogk="
# Private key not retained: the config was exported once at creation.
address = "10.8.1.1"
# split: only the home zones go to the gateway; everything else stays local.
dns = "split"
# mapped_subnets: routes for the visible networks' client prefixes plus the shim.
allowed_ips = "mapped_subnets"
persistent_keepalive = 25

[[peer]]
name = "laptop"
grants = ["personal"]
transport = "wireguard"
[peer.wireguard]
public_key = "zo060cy2M+x7cMF4FKXHbs0CloUFDTRHRboFhw5YfVk="
address = "10.8.1.2"
# Private key retained (--keep-private-key) so configs can be regenerated.
private_key = "AAICAgICAgICAgICAgICAgICAgICAgICAgICAgICAkI="
dns = "split"
allowed_ips = "mapped_subnets"
persistent_keepalive = 25

[[peer]]
name = "sister-phone"
grants = ["family"]
transport = "wireguard"
expires = "2027-12-31"
[peer.wireguard]
public_key = "Xf7dO2vUf2+ijuFdlp1bsOpTd01Ii9r53xxuASSz7yI="
address = "10.8.2.1"
private_key = "AAMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA0M="
preshared_key = "CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk="
# Plain WireGuard cannot split DNS on phones, so send everything to the
# gateway; the Tailscale client does split DNS natively on every platform.
dns = "tunnel_wide"
# grants_only: the config routes just the granted hosts (in virtual space) plus the shim.
allowed_ips = "grants_only"
persistent_keepalive = 25
# Routes and routing domains only for these networks (default: all of them).
# visible_networks = ["home"]

# M2 will add Tailscale peers like this one; the engine accepts them today so
# the model is final, but does nothing with them until Headscale is wired in.
# [[peer]]
# name = "apple-tv"
# grants = ["personal"]
# transport = "tailscale"
