[workspace]
resolver = "2"
members = ["crates/parallax-core", "crates/parallax-store", "crates/parallax-proxy", "crates/parallax-dns", "crates/parallax-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# The pinned toolchain (rust-toolchain.toml): the only compiler CI builds with.
rust-version = "1.100"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: `config export` keeps the model's field order.
toml = { version = "1", features = ["preserve_order"] }
ipnet = { version = "2.10", features = ["serde"] }
thiserror = "2"
base64 = "0.23"
x25519-dalek = { version = "3", features = ["static_secrets"] }
rand = "0.10"
similar = "2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
proptest = "1"
# The HTTPS proxy (parallax-proxy). rustls uses the ring provider: it builds
# cleanly on Alpine/musl, where aws-lc-rs needs cmake and more.
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync"] }
hyper = { version = "1.7", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.17", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1.3"
bytes = "1"
tower-service = "0.3"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "ring", "tls12", "logging"] }
rcgen = "0.14"
# The DNS server (parallax-dns): hickory's server for UDP/TCP framing,
# truncation and EDNS, and its resolver (re-exported by the server) for
# forwarding with a cache and TCP fallback. async-trait: hickory's handler
# trait needs it.
hickory-server = { version = "0.26.3", default-features = false, features = ["resolver"] }
async-trait = "0.1"
# The database (parallax-store): Turso, the Rust rewrite of SQLite, in
# SQLite's file format. Pinned exactly while it's before 1.0. No default
# features: they add mimalloc (C) and full-text search, neither needed.
turso = { version = "=0.8.4", default-features = false }
# Backups (parallax-store): `age` encrypts them with a passphrase, so an
# operator can also open one by hand with the `age` tool; `tar` packs the
# files; `sha2` checksums them.
age = "0.12"
tar = { version = "0.4.46", default-features = false }
sha2 = "0.10"
# The CLI's owner-only umask, so every file Turso creates (WAL, coordination
# file) is born private, and reading a passphrase without echo. Already in the tree through Turso.
rustix = { version = "1", default-features = false, features = ["std", "process", "fs", "termios"] }

# Enforced in CI via `cargo clippy -- -D warnings`. See AGENTS.md.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Backup encryption's key derivation (scrypt) is deliberately slow; unoptimized
# it takes minutes, so tests build it optimized.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
