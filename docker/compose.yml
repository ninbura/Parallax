# Parallax: both services are required. `parallax` carries every packet
# (WireGuard, the Tailscale subnet router, NETMAP, the DNS shim) in the host
# network namespace; `headscale` is the control plane and carries no traffic.
#
# The images are the released ones on GHCR (docs/releasing.md). Pin a release
# with PARALLAX_VERSION in docker/.env (e.g. PARALLAX_VERSION=0.2.0); both
# images share it. To build both from this checkout instead:
#   docker compose -f compose.yml -f compose.build.yml up -d --build
services:
  parallax:
    image: ghcr.io/ninbura/parallax:${PARALLAX_VERSION:-latest}
    container_name: parallax
    restart: unless-stopped
    # Host networking: wg0 and tailscale0 live next to the LAN interface, and
    # the nftables table sees real interface names. Requires ip_forward=1 on the host.
    network_mode: host
    # Rootful Docker only: `parallax doctor` refuses to start in a user namespace.
    # The wireguard module is loaded on the host (docs/setup.md), not from here.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/etc/parallax          # wg-server.key (0600); parallax.toml, imported on the first start
      # Certificates for proxied hostnames (server.proxy.certificates). Mount
      # only what Parallax should hold, read-only; certbot's live/ entries
      # link into archive/, so mount both at the same paths. docs/setup.md.
      # - /etc/letsencrypt/live/immich.mydomain.com:/etc/letsencrypt/live/immich.mydomain.com:ro
      # - /etc/letsencrypt/archive/immich.mydomain.com:/etc/letsencrypt/archive/immich.mydomain.com:ro
      - parallax-state:/var/lib/parallax  # the database (parallax.db) and generated files
      # Backups (server.backup.directory), a plain folder on the host so they
      # are easy to copy elsewhere. Best on another disk. docs/backup.md.
      - ./backups:/var/lib/parallax/backups
      - tailscale-state:/var/lib/tailscale
      # This machine already on Tailscale? Use its client as the subnet
      # router instead of starting a second one (they'd clash): mount its
      # socket here and set PARALLAX_TAILSCALED below. Parallax then never
      # changes its settings; `parallax doctor` says what to run. docs/setup.md.
      # - /run/tailscale:/var/run/tailscale
    environment:
      # PARALLAX_TAILSCALED: host
      PARALLAX_CONFIG: /etc/parallax/parallax.toml
      PARALLAX_DB: /var/lib/parallax/parallax.db
      PARALLAX_OUT: /var/lib/parallax
    depends_on:
      - headscale

  headscale:
    # Built from a pinned commit of Headscale's main branch, for `tailscale
    # cert` and HTTPS `tailscale serve` (headscale.Dockerfile, ADR 0014).
    # Parallax's Headscale client is written against that commit, so the two
    # images are released together under one version.
    image: ghcr.io/ninbura/parallax-headscale:${PARALLAX_VERSION:-latest}
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./headscale:/etc/headscale       # config.yaml (see headscale/config.yaml)
      - headscale-data:/var/lib/headscale
    ports:
      - "8080:8080"      # control plane (put behind TLS; server_url must be https)
      - "3478:3478/udp"  # embedded DERP STUN (derp = "embedded")
      - "9090:9090"      # metrics (optional)

volumes:
  parallax-state:
  tailscale-state:
  headscale-data:
